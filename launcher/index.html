<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, height=720, initial-scale=1, user-scalable=no">
<title>Audi MMI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="statusbar">
    <span id="clock">--:--</span>
    <span id="status" class="status-dot"></span>
  </div>

  <div class="grid">
    <button class="tile tile-carplay" data-action="start-carplay">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 2a2 2 0 0 1 2 2v.09A9 9 0 0 1 21 13v5a2 2 0 0 1-2 2h-1v-6a6 6 0 0 0-12 0v6H5a2 2 0 0 1-2-2v-5a9 9 0 0 1 7-8.91V4a2 2 0 0 1 2-2z"/></svg>
      <span>CarPlay</span>
    </button>

    <button class="tile tile-vehicle" data-action="open-vehicle">
      <svg viewBox="0 0 24 24" class="icon"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11m-14 0h14m-14 0a2 2 0 0 0-2 2v5h2m14-7a2 2 0 0 1 2 2v5h-2M6 18v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-1m16 0v1a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1"/></svg>
      <span>Fahrzeugdaten</span>
    </button>

    <button class="tile tile-settings" data-action="open-settings">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8-3a8 8 0 0 0-.1-1.2l2-1.6-2-3.5-2.4 1a8 8 0 0 0-2-1.2L15 2H9l-.5 2.5a8 8 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.6A8 8 0 0 0 4 12a8 8 0 0 0 .1 1.2l-2 1.6 2 3.5 2.4-1a8 8 0 0 0 2 1.2L9 22h6l.5-2.5a8 8 0 0 0 2-1.2l2.4 1 2-3.5-2-1.6A8 8 0 0 0 20 12z"/></svg>
      <span>Einstellungen</span>
    </button>

    <button class="tile tile-shutdown" data-action="shutdown">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 2v9m6.36-6.36a9 9 0 1 1-12.72 0"/></svg>
      <span>Herunterfahren</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
