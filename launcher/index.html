<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, height=720, initial-scale=1, user-scalable=no">
<title>MMI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <span class="dot" id="conn-dot"></span>
      <span class="label" id="conn-label">CarPlay bereit</span>
    </div>
    <div class="topbar-right">
      <span class="chip" id="temp-chip">--&deg;C</span>
      <span class="clock" id="clock">--:--</span>
      <span class="date" id="date">--</span>
    </div>
  </div>

  <div class="stage">
    <div class="widget widget-carplay" data-action="start-carplay">
      <div class="widget-head">
        <span class="widget-title">CarPlay</span>
        <span class="widget-sub" id="carplay-sub">Kein Gerät verbunden</span>
      </div>
      <svg viewBox="0 0 24 24" class="widget-icon"><path d="M12 2a2 2 0 0 1 2 2v.09A9 9 0 0 1 21 13v5a2 2 0 0 1-2 2h-1v-6a6 6 0 0 0-12 0v6H5a2 2 0 0 1-2-2v-5a9 9 0 0 1 7-8.91V4a2 2 0 0 1 2-2z"/></svg>
    </div>

    <div class="stage-column">
      <div class="widget widget-small" data-action="open-vehicle">
        <div class="widget-head">
          <span class="widget-title">Fahrzeug</span>
          <span class="widget-sub">Status &amp; Verbrauch</span>
        </div>
        <svg viewBox="0 0 24 24" class="widget-icon small"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11m-14 0h14m-14 0a2 2 0 0 0-2 2v5h2m14-7a2 2 0 0 1 2 2v5h-2M6 18v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-1m16 0v1a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1"/></svg>
      </div>

      <div class="widget widget-small" data-action="open-settings">
        <div class="widget-head">
          <span class="widget-title">Einstellungen</span>
          <span class="widget-sub">System &amp; Anzeige</span>
        </div>
        <svg viewBox="0 0 24 24" class="widget-icon small"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8-3a8 8 0 0 0-.1-1.2l2-1.6-2-3.5-2.4 1a8 8 0 0 0-2-1.2L15 2H9l-.5 2.5a8 8 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.6A8 8 0 0 0 4 12a8 8 0 0 0 .1 1.2l-2 1.6 2 3.5 2.4-1a8 8 0 0 0 2 1.2L9 22h6l.5-2.5a8 8 0 0 0 2-1.2l2.4 1 2-3.5-2-1.6A8 8 0 0 0 20 12z"/></svg>
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="dock-btn active" data-action="go-home" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    </button>
    <button class="dock-btn" data-action="start-carplay" title="CarPlay">
      <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v.09A9 9 0 0 1 21 13v5a2 2 0 0 1-2 2h-1v-6a6 6 0 0 0-12 0v6H5a2 2 0 0 1-2-2v-5a9 9 0 0 1 7-8.91V4a2 2 0 0 1 2-2z"/></svg>
    </button>
    <button class="dock-btn" data-action="open-vehicle" title="Fahrzeug">
      <svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11m-14 0h14m-14 0a2 2 0 0 0-2 2v5h2m14-7a2 2 0 0 1 2 2v5h-2M6 18v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-1m16 0v1a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1"/></svg>
    </button>
    <button class="dock-btn" data-action="open-settings" title="Einstellungen">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8-3a8 8 0 0 0-.1-1.2l2-1.6-2-3.5-2.4 1a8 8 0 0 0-2-1.2L15 2H9l-.5 2.5a8 8 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.6A8 8 0 0 0 4 12a8 8 0 0 0 .1 1.2l-2 1.6 2 3.5 2.4-1a8 8 0 0 0 2 1.2L9 22h6l.5-2.5a8 8 0 0 0 2-1.2l2.4 1 2-3.5-2-1.6A8 8 0 0 0 20 12z"/></svg>
    </button>
    <button class="dock-btn dock-btn-danger" data-action="shutdown" title="Herunterfahren">
      <svg viewBox="0 0 24 24"><path d="M12 2v9m6.36-6.36a9 9 0 1 1-12.72 0"/></svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
